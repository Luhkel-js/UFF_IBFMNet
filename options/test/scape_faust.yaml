# general setting
name: scape_faust
backend: dp # DataParallel
type: UFFIBModel
num_gpu: 1 
gpu_idx: 1 #
manual_seed: 1234
non-isometric: false
partial: false
visualize: false

# path
path:
  resume_state: checkpoints/scape.pth
  resume: false

# datasets
datasets:
  test_dataset:
    name: FaustVal
    type: PairFaustDataset
    phase: test
    data_root: ../data/FAUST_r/
    return_evecs: true
    return_faces: true
    num_evecs: 200
    return_corr: true
    return_dist: true

# network setting
networks:
  feature_extractor:
    type: DiffusionNet
    in_channels: 16
    out_channels: 128
    cache_dir: ../data/FAUST_r/diffusion
    input_type: hks
  permutation:
    type: Similarity
    tau: 0.07
    hard: true

# validation setting
val:
  metrics:
    geo_error:
      type: calculate_geodesic_error
    plot_pck:
      type: plot_pck
