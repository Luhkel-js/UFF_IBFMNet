# general setting
name: faust_shrec19
backend: dp # DataParallel
type: UFFIBModel
num_gpu: 1 #
gpu_idx: 0 #
manual_seed: 1234
non-isometric: false 
partial: false
visualize: true

# path
path:
  resume_state: checkpoints/faust.pth 
  resume: false

# datasets
datasets:
  test_dataset:
    name: Shrec19Val
    type: PairShrec19Dataset
    phase: test
    data_root: ../data/SHREC19_r
    return_evecs: True
    return_faces: True
    num_evecs: 200
    return_dist: True

# network setting
networks:
  feature_extractor:
    type: DiffusionNet
    in_channels: 16
    out_channels: 128
    cache_dir: ../data/SHREC19_r/diffusion
    input_type: hks
  fmap_net:
    type: RegularizedFMNet
    bidirectional: false
  permutation:
    type: Similarity
    tau: 0.07
    hard: true

# validation setting
val:
  metrics:
    geo_error:
      type: calculate_geodesic_error
    plot_pck:
      type: plot_pck
